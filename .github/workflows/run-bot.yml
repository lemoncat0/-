name: 每日天气推送

on:
  schedule:
 # UTC 时间，比北京时间慢 8 小时；30 23 * * * = 北京时间早上 07:30
    - cron: '30 23 * * *'
  workflow_dispatch:

# 允许脚本生成的聚合页回推到 main 分支
permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 requests 依赖
        run: pip install requests

      - name: 执行推送脚本（生成 index.html 并发送卡片）
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          OPENID: ${{ secrets.OPENID }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
        run: python send_msg.py

      - name: 提交当日聚合页（有变化才提交）
        run: |
          git config user.name "lemoncat0"
          git config user.email "lemoncat0@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "chore: daily page $(date +%F)" && git push)
