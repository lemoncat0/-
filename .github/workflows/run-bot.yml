name: 每日天气推送
on:
  schedule:
    # UTC时间，比北京时间慢8小时；30 23 * * * = 北京时间早上 07:30
    - cron: '30 23 * * *'
  # 支持手动点按钮触发测试，这个非常关键
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装requests依赖
        run: pip install requests

      - name: 执行推送脚本
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          OPENID: ${{ secrets.OPENID }}
          TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          TARGET_CITY: ${{ secrets.TARGET_CITY }}
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          LOVE_START_DATE: ${{ secrets.LOVE_START_DATE }}
        run: python send_msg.py
